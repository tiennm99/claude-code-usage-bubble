<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Claude Code Usage Bubble</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      .pill {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        border-radius: 9999px;
        background: #1f1f1f;
        color: #f0f0f0;
        font: 600 14px "Segoe UI", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="pill">Claude Code Usage Bubble</div>
  </body>
</html>
