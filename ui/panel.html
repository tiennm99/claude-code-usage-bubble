<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <title>Usage panel</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <div class="stripe" id="stripe"></div>
    <div class="text header" id="header"></div>
    <div class="row session">
      <div class="text row-label" id="session-label"></div>
      <div class="bar"><div class="fill" id="session-fill"></div></div>
      <div class="text row-text" id="session-text"></div>
    </div>
    <div class="row weekly">
      <div class="text row-label" id="weekly-label"></div>
      <div class="bar"><div class="fill" id="weekly-fill"></div></div>
      <div class="text row-text" id="weekly-text"></div>
    </div>
  </body>
</html>
